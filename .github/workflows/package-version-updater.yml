---
name: Package version updater
"on":
  schedule:
    - cron: 42 5 * * 1
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update-package-version-not-updated-by-dependabot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # to prevent cannot find github.com username while running package
          # version update script, persist-credentials has been set to true
          persist-credentials: true
      - env:
          DEPENDENCIES_LABEL: dependencies
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION_UPDATER_BRANCH: package-version-updater
          BUILD_TASKFILE: build/task.yml
        run: ./scripts/package-version-updater.sh
        shell: bash
